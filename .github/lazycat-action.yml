version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: cyberchef
build:
  toolchains: []
  run_buildscript: false
images:
  - id: cyberchef
    target: service
    service: cyberchef
    source: ghcr.io/gchq/cyberchef
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: CyberChef
    summary: 浏览器中的编码解码、哈希与数据转换工具箱
